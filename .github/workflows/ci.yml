name: CI Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22' # Compatible with 1.22+ 
    - name: Check Formatting
      run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then echo "Code is not formatted. Run 'go fmt ./...'"; exit 1; fi
    - name: Run Linter (go vet)
      run: go vet ./...
    - name: Run Tests
      run: go test -v ./...
    - name: Build Binary
      run: go build -v ./...
